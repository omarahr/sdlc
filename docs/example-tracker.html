<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>SDLC Build Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #e6e8ec;
  --surface: #f7f8fa;
  --sunk: #edeff3;
  --ink: #0d1117;
  --muted: #59616f;
  --faint: #858d9b;
  --rule: #c6ccd5;
  --rule-soft: #dee2e9;
  --live: #0b6fd4;
  --live-soft: #e2ecfa;
  --held: #0f7a52;
  --held-soft: #ddeee5;
  --hold: #a35c00;
  --hold-soft: #f6ead6;
  --fail: #b3261e;
  --sans: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0b0e12;
    --surface: #13171d;
    --sunk: #191e25;
    --ink: #e7ebf1;
    --muted: #9aa3b1;
    --faint: #6b7482;
    --rule: #2b323c;
    --rule-soft: #222831;
    --live: #58a2f8;
    --live-soft: #16233a;
    --held: #46b581;
    --held-soft: #12271e;
    --hold: #d99a3a;
    --hold-soft: #2b2113;
    --fail: #f0776b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0b0e12;
  --surface: #13171d;
  --sunk: #191e25;
  --ink: #e7ebf1;
  --muted: #9aa3b1;
  --faint: #6b7482;
  --rule: #2b323c;
  --rule-soft: #222831;
  --live: #58a2f8;
  --live-soft: #16233a;
  --held: #46b581;
  --held-soft: #12271e;
  --hold: #d99a3a;
  --hold-soft: #2b2113;
  --fail: #f0776b;
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 18px; padding-block: 20px 48px; }
#app { display: block; background: var(--surface); border: 1px solid var(--rule); }
h1, h2 { margin: 0; font-weight: 600; }
h2 { font-size: 12.5px; letter-spacing: 0; }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
a { color: var(--live); }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 20px; padding-bottom: 14px; }
.top h1 { font-size: 19px; letter-spacing: -.01em; }
.top .sub { color: var(--muted); font-size: 12.5px; }
.fresh { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--live); }
.pill.ok .dot { background: var(--held); }
.pill.warn .dot { background: var(--hold); }
.pill.live .dot { animation: pulse 2.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { .pill.live .dot { animation: none; } }
.stale { color: var(--hold); font-weight: 500; }

/* one ruled surface: regions divide it, nothing floats */
.card { background: var(--surface); padding: 16px 18px; min-width: 0; }
.card + .card, .panel + .card, .grid3, .grid2, .band, .panel { border-top: 1px solid var(--rule); }
.grid3 { display: grid; grid-template-columns: 1.3fr 1fr 1fr; }
.grid2 { display: grid; grid-template-columns: 1.5fr 1fr; }
@media (max-width: 900px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 > :first-child { grid-column: 1 / -1; border-right: 0; } }
@media (max-width: 860px) { .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 620px) { .grid3 { grid-template-columns: 1fr; } }
.grid3 > .card, .grid2 > .card { border-right: 1px solid var(--rule); }
.grid3 > .card:last-child, .grid3 > .card:nth-child(3), .grid2 > .card:last-child { border-right: 0; }
/* a full-width row under the three columns */
.grid3 > .wide { grid-column: 1 / -1; border-right: 0; border-top: 1px solid var(--rule); }
@media (max-width: 620px) { .grid3 > .card { border-right: 0; } .grid3 > .card + .card { border-top: 1px solid var(--rule); } }
.card h2 { margin-bottom: 10px; color: var(--muted); }
.card h2 .n { font-family: var(--mono); color: var(--faint); font-weight: 400; margin-left: 6px; }

/* the run band: where the machine is right now */
.band { padding: 0; }
.band-top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 10px 28px; padding: 15px 18px 13px; }
.band-top > div { min-width: 0; max-width: 100%; }
.run-name { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
.run-name .beacon { width: 8px; height: 8px; border-radius: 50%; background: var(--live); flex: none; }
.run-name .beacon.on { animation: pulse 2.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .run-name .beacon.on { animation: none; } }
.run-name .beacon.done { background: var(--held); }
.run-line { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
.run-now { font-family: var(--mono); font-size: 12px; color: var(--live); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.band-right { display: flex; gap: 26px; align-items: flex-start; }

/* the phase rail: every phase, sized by the agent time spent in it */
.rail { display: flex; gap: 1px; border-top: 1px solid var(--rule); background: var(--rule-soft); }
@media (max-width: 720px) { .run-now { white-space: normal; } }
.rail-seg { flex: 1 1 0; min-width: 0; background: var(--surface); padding: 8px 7px 7px; position: relative; }
.rail-seg .ph { display: block; font-size: 10.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-seg .bar { height: 3px; background: var(--held); margin: 6px 0 5px; min-width: 3px; }
.rail-seg .ct { font-family: var(--mono); font-size: 10px; color: var(--faint); }
.rail-seg.idle { background: var(--sunk); }
.rail-seg.idle .bar { background: var(--rule); }
.rail-seg.done .ph, .rail-seg.done .ct { color: var(--muted); }
.rail-seg.run { background: var(--live-soft); }
.rail-seg.run .ph { color: var(--live); font-weight: 600; }
.rail-seg.run .bar { background: var(--live); animation: pulse 2.2s ease-in-out infinite; }
.rail-seg.run .ct { color: var(--live); }
@media (prefers-reduced-motion: reduce) { .rail-seg.run .bar { animation: none; } }
.rail-seg.bad .bar { background: var(--fail); }
@media (max-width: 820px) { .rail { flex-wrap: wrap; } .rail-seg { flex: 1 1 30%; } }

/* the numbers, when no run is live */
.stats { display: flex; flex-wrap: wrap; gap: 4px 40px; padding: 15px 18px; }
.stat .n { font-family: var(--mono); font-size: 27px; font-weight: 500; letter-spacing: -.02em; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat .n small { font-size: 14px; color: var(--faint); }
.stat .l { color: var(--muted); font-size: 12px; }

/* the current slice */
.slice-id { font-family: var(--mono); font-size: 11.5px; color: var(--live); }
.slice-title { font-size: 15px; font-weight: 600; line-height: 1.25; margin-top: 1px; }
.steps { display: flex; gap: 2px; margin-top: 11px; }
.steps i { flex: 1; height: 3px; background: var(--rule-soft); }
.steps i.past { background: var(--held); }
.steps i.on { background: var(--live); }
.step-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; gap: 8px; }
.step-label b { color: var(--live); font-weight: 600; }
.lastc { font-size: 11.5px; color: var(--faint); margin-top: 9px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; margin: 0; font-size: 12.5px; align-items: baseline; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.meter { grid-column: 1 / -1; height: 3px; background: var(--rule-soft); margin-top: 1px; }
.meter i { display: block; height: 100%; background: var(--live); }

/* needs you */
.parked { display: grid; gap: 5px; font-size: 12.5px; }
.parked div { display: grid; grid-template-columns: 54px minmax(0, 1fr); gap: 10px; }
.parked .mono { color: var(--hold); font-size: 11.5px; }
.review { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 11px; }
.review span { font-size: 12px; background: var(--sunk); padding: 3px 8px; color: var(--muted); }
.review b { font-family: var(--mono); color: var(--ink); font-weight: 500; }
.note { font-size: 11.5px; color: var(--faint); margin-top: 9px; }

/* titled regions, always open so a reload never folds them away */
.panel-head { padding: 12px 18px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel-head h2 { margin: 0; }
.panel-head .hint { color: var(--faint); font-size: 11.5px; }
.panel-body { padding: 0 18px 16px; }

/* milestones, one ruled row each */
.ms-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.ms-note { font-size: 11.5px; color: var(--faint); }
.ms-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) 160px 150px; gap: 0 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--rule-soft); }
.ms-row:first-child { border-top: 0; }
.ms-row .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--rule); }
.ms-row.done .dot { background: var(--held); border-color: var(--held); }
.ms-row.active .dot { border-color: var(--live); background: var(--live); }
.ms-name { font-weight: 500; font-size: 13px; }
.ms-row.done .ms-name { color: var(--muted); font-weight: 400; }
.ms-what { font-size: 11.5px; color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-prog .mini { display: flex; gap: 2px; height: 6px; }
.ms-prog .mini i { flex: 1; background: var(--rule); }
.ms-prog .mini i.done { background: var(--held); }
.ms-prog .mini i.parked { background: var(--hold); }
.ms-prog .mini i.in_progress { background: var(--live); }
.ms-prog .cnt { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-top: 4px; }
.ms-eta { text-align: right; white-space: nowrap; font-family: var(--mono); }
.ms-eta b { display: block; font-weight: 500; font-size: 12.5px; color: var(--ink); }
.ms-eta span { font-size: 11px; color: var(--faint); }
.ms-row.done .ms-eta b { color: var(--held); }
@media (max-width: 720px) { .ms-row { grid-template-columns: 14px minmax(0, 1fr) auto; } .ms-what, .ms-prog { display: none; } }
.badge, .vbadge { font-size: 9.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 5px; margin-left: 6px; border: 1px solid var(--rule); color: var(--muted); }
.badge { border-color: var(--live); color: var(--live); }
.vbadge.verified { color: var(--held); border-color: var(--held); }
.vbadge.fixing, .vbadge.exhausted { color: var(--hold); border-color: var(--hold); }

/* pace chart */
.chart-wrap { overflow-x: auto; }
svg text { font-family: var(--mono); font-size: 10px; }
.spark { display: block; width: 100%; height: 34px; }

/* events */
.events { display: grid; }
.ev { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 0 12px; font-size: 12.5px; padding: 7px 0; border-top: 1px solid var(--rule-soft); }
.ev:first-child { border-top: 0; }
.ev .when { font-family: var(--mono); font-size: 11px; color: var(--faint); }
.ev .kind { font-size: 11.5px; font-weight: 600; }
.ev .kind.merged { color: var(--held); }
.ev .kind.escalated { color: var(--hold); }
.ev .txt { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.more { font: inherit; font-size: 11.5px; background: none; border: 0; padding: 8px 0 0; color: var(--live); cursor: pointer; }

/* workflow view */
.wf-slot[hidden] { display: none; }
.wf { padding: 0; }
.wf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 18px; flex-wrap: wrap; padding: 13px 18px; border-bottom: 1px solid var(--rule); }
.wf-head .name { color: var(--live); font-weight: 600; font-size: 13px; }
.wf-head .desc { color: var(--muted); flex: 1 1 260px; min-width: 0; font-size: 12px; }
.wf-head .tot { color: var(--muted); font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
.wf-head .paused { color: var(--hold); white-space: nowrap; }
/* the box the card is drawn into: it caps how far the agent list can stretch the page, and it wraps
   the card rather than sitting inside it, because a redraw replaces the card and a scroller inside
   it would go back to the top every couple of seconds. max-height, so a short run is not padded out */
.wf-scroll { max-height: min(440px, 60vh); overflow-y: auto; overflow-x: hidden; }
.wf-body { display: grid; grid-template-columns: 200px minmax(0, 1fr); }
.wf-phases { border-right: 1px solid var(--rule); padding: 6px 0; background: var(--sunk); }
.wf-phase { display: grid; grid-template-columns: 16px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; width: 100%; padding: 3px 12px; border: 0; background: none; font: inherit; font-size: 12px; color: var(--ink); text-align: left; cursor: pointer; }
.wf-phase:hover { background: var(--live-soft); }
.wf-phase.sel { background: var(--live-soft); color: var(--live); font-weight: 600; }
.wf-phase.idle { color: var(--faint); cursor: default; }
.wf-phase.idle:hover { background: none; }
.wf-phase .mk { text-align: right; color: var(--faint); font-size: 10px; }
.wf-phase .cnt { color: var(--faint); font-family: var(--mono); font-size: 10.5px; }
.wf-phase.sel .cnt { color: var(--live); }
.wf .ok { color: var(--held); }
.wf .bad { color: var(--fail); }
.wf .run { color: var(--live); animation: pulse 2.2s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { .wf .run { animation: none; } }
.wf-agents { padding: 10px 14px 12px; min-width: 0; }
.wf-agents h3 { font: inherit; font-weight: 600; font-size: 12.5px; margin: 0 0 6px; }
.wf-agents h3 span { color: var(--faint); font-weight: 400; }
.wf-agent { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; padding: 2px 0; font-size: 12px; }
.wf-agent .lbl { font-family: var(--mono); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wf-agent .meta, .wf-agent .time { color: var(--faint); font-family: var(--mono); font-size: 11px; white-space: nowrap; }
.wf-agent.failed .lbl, .wf-agent.stopped .lbl { color: var(--muted); }
.wf-foot { display: flex; gap: 6px 16px; flex-wrap: wrap; padding: 0 18px 12px; color: var(--faint); font-size: 11.5px; }
.wf-foot button { font: inherit; background: none; border: 0; padding: 0; color: var(--live); cursor: pointer; }
.wf-earlier { margin: 0 18px 14px; font-size: 11.5px; color: var(--muted); }
.wf-earlier summary { cursor: pointer; color: var(--live); }
@media (max-width: 720px) {
  .wf-body { grid-template-columns: 1fr; }
  .wf-phases { border-right: 0; border-bottom: 1px solid var(--rule); }
  .wf-agent { grid-template-columns: 14px minmax(0, 1fr) auto; }
  .wf-agent .meta { display: none; }
}

/* test reports */
.example { font-size: 12px; background: var(--live-soft); color: var(--live); padding: 8px 18px; }
.reports-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
.reports-head input { font: inherit; font-size: 12px; padding: 4px 8px; border: 1px solid var(--rule); background: var(--sunk); color: var(--ink); min-width: 0; width: 200px; max-width: 100%; }
.rep-list { display: grid; }
.rep { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 3px 12px; align-items: baseline; padding: 7px 0; border-top: 1px solid var(--rule-soft); font-size: 12.5px; }
.rep:first-child { border-top: 0; }
.rep a.id { font-family: var(--mono); font-size: 11.5px; text-decoration: none; }
.rep .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rep .n { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
.rep .n.has { color: var(--held); }
.rep .lenses { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 4px; }
.lens { font-size: 10.5px; padding: 1px 6px; background: var(--sunk); color: var(--muted); border: 1px solid var(--rule); white-space: nowrap; }
.lens.held { color: var(--held); border-color: var(--held); }
.lens.refuted { color: var(--hold); border-color: var(--hold); }
.rep-more { margin-top: 8px; font: inherit; font-size: 11.5px; background: none; border: 1px solid var(--rule); color: var(--live); padding: 4px 9px; cursor: pointer; }
.empty { padding: 40px 18px; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">SDLC Build Tracker</h1>
      <p class="sub">Autonomous build of the spec with /sdlc, one slice at a time.</p>
    </div>
    <div class="fresh" id="fresh"></div>
  </header>
  <div id="app"><div class="card empty">No status yet. Run the tracker collector.</div></div>
</div>

(function (root) {
  "use strict";
  // a live run whose live.js has not moved for this long has lost its watcher
  const PAUSED_MS = 30 * 1000;
  // decides when the workflow card is redrawn from a live.js payload; the page wires it to the DOM
  root.SDLC_createLive = function (opts) {
    let builtAt = "", wf = null, paused = false, drawn = "";
    const isPaused = () => !!wf.run.live && opts.now() - Date.parse(builtAt) > PAUSED_MS;
    return {
      apply(p) {
        if (!p || typeof p.builtAt !== "string" || isNaN(Date.parse(p.builtAt)) || p.builtAt <= builtAt) return false;
        // a payload without a run (the journal was unreadable for a moment) keeps the last good card
        if (!p.workflow || !p.workflow.run) return false;
        // every payload moves the clock that decides "paused", but the card is rebuilt only when it would look different
        const was = paused, json = JSON.stringify(p.workflow);
        builtAt = p.builtAt;
        wf = p.workflow;
        paused = isPaused();
        if (json === drawn && paused === was) return false;
        drawn = json;
        opts.redraw(wf, paused);
        return true;
      },
      // runs on every poll: a dead watcher sends nothing, so the paused note has to come from the clock
      tick() {
        if (!wf || isPaused() === paused) return false;
        paused = !paused;
        opts.redraw(wf, paused);
        return true;
      },
    };
  };
})(typeof window !== "undefined" ? window : globalThis);

      left.replaceChildren();
      names.forEach((n, i) => {
        const list = by[n];
        const done = list.filter((a) => a.status !== "running").length;
        const b = el("button", "wf-phase" + (n === sel ? " sel" : "") + (list.length ? "" : " idle"));
        b.type = "button";
        const running = list.some((a) => a.status === "running");
        const bad = list.some((a) => a.status === "failed");
        const mk = !list.length ? el("span", "mk", String(i + 1)) : running ? el("span", "mk run", "●") : el("span", "mk " + (bad ? "bad" : "ok"), bad ? "!" : "✔");
        b.dataset.phase = n;
        b.append(mk, el("span", "", n), el("span", "cnt", list.length ? done + "/" + list.length : ""));
        b.title = !list.length ? "Not started in this run" : running ? "Running" : bad ? "Finished; some agents failed and were retried" : "Finished";
        if (list.length) b.addEventListener("click", () => { sel = n; pinned(run.id, n === auto ? "" : n); tailing = n === auto; draw(); if (tailing) snapToTail(); else reveal(); });
        left.append(b);
      });
      right.replaceChildren();
      const list = by[sel] || [];
      const total = list.reduce((t, a) => t + (agentSeconds(a) || 0), 0);
      const h = el("h3", "", sel + " ");
      h.append(el("span", "", "· " + list.length + (list.length === 1 ? " agent" : " agents") + (total ? " · " + clock(total) + " of agent time" : "")));
      right.append(h);
      list.forEach((a) => {
        const r = el("div", "wf-agent " + a.status);
        if (a.status === "running" && a.startedAt) r.dataset.start = a.startedAt;
        const icon = a.status === "done" ? el("span", "ok", "✔") : a.status === "failed" ? el("span", "bad", "✘") : a.status === "running" ? el("span", "run", "●") : el("span", "", "○");
        icon.title = a.status === "stopped" ? "The run ended before this agent finished" : a.status;
        const lbl = el("span", "lbl", a.label); lbl.title = a.label;
        r.append(icon, lbl, el("span", "meta", (a.model ? a.model + " · " : "") + tokens(a.tokens)), el("span", "time", clock(agentSeconds(a))));
        right.append(r);
      });
      if (!list.length) right.append(el("p", "note", "No agent has run in this phase yet."));
      foot.replaceChildren();
      if (failed) foot.append(el("span", "bad", failed + (failed === 1 ? " agent failed" : " agents failed") + " in this run"));
      if (sel !== auto) {
        const f = el("button", "", "Follow the live phase");
        f.type = "button";
        f.dataset.follow = "1";
        f.addEventListener("click", () => { sel = auto; pinned(run.id, ""); tailing = true; draw(); snapToTail(); });
        foot.append(f);
      }
    };
    draw();
    body.append(left, right);
    card.append(body, foot);
    if ((wf.earlier || []).length) {
      const d = el("details", "wf-earlier");
      d.open = earlierOpen();
      d.addEventListener("toggle", () => earlierOpen(d.open));
      d.append(el("summary", "", wf.earlier.length + (wf.earlier.length === 1 ? " earlier run" : " earlier runs") + " of this loop"));
      wf.earlier.forEach((r) => {
        const span = r.startedAt && r.endedAt ? clock((new Date(r.endedAt) - new Date(r.startedAt)) / 1000) : "";
        d.append(el("div", "", (r.startedAt ? fmtDay(new Date(r.startedAt)) + " · " : "") + r.done + "/" + r.agents + " agents done" + (r.failed ? " · " + r.failed + " failed" : "") + (r.stopped ? " · " + r.stopped + " cut off" : "") + (span ? " · " + span : "")));
      });
      card.append(d);
    }
    return card;
  }

  // the workflow card is redrawn on its own from live.js, so it sits in a slot of its own.
  // the rail above it is the summary; the agent list is behind a toggle so the fold still holds.
  // wfScroll is the slot's own scroll box and is the node whose children the redraw replaces, so
  // where the person has scrolled to survives it.
  let wfSlot = null, wfScroll = null;
  // while the live phase is on show the box tails it: every rebuild keeps the newest agent in view.
  // scrolling up pauses the tail; the bottom of the box, or the follow button, resumes it.
  let tailing = true;
  // picking a phase swaps the list under the heading, so the box goes back to the top of the card
  function revealWorkflow() { if (wfScroll) wfScroll.scrollTop = 0; }
  function snapToTail() { if (wfScroll) wfScroll.scrollTop = wfScroll.scrollHeight; }
  function drawWorkflow(wf, paused) {
    if (!wfSlot || !wf || !wf.run) { if (wfSlot) wfSlot.hidden = true; return; }
    // drawn from Claude Code's own run files; if their shape changes, the last card stays
    try {
      // a rebuild must not take keyboard focus away from the phase or follow button the person is on
      const at = document.activeElement;
      const had = at && wfSlot.contains(at) ? (at.dataset.follow ? { follow: true } : at.dataset.phase ? { phase: at.dataset.phase } : null) : null;
      const card = workflowCard(wf, paused, revealWorkflow);
      wfScroll.replaceChildren(card);
      wfSlot.hidden = false;
      if (had) {
        const btns = Array.from(wfSlot.querySelectorAll("button"));
        const next = btns.find((b) => had.follow ? b.dataset.follow : b.dataset.phase === had.phase);
        // the control is where it was a moment ago, so the focus goes back without moving the page
        // or the list the person may be reading
        if (next) next.focus({ preventScroll: true });
      }
      // a followed phase keeps the newest agent in view; a scrolled-up or pinned one stays put
      if (tailing && card.dataset.liveTail) snapToTail();
    } catch (err) { /* no workflow view */ }
  }
  // running agents' clocks tick between redraws
  function tickClocks() {
    if (!wfSlot) return;
    wfSlot.querySelectorAll(".wf-agent.running[data-start]").forEach((r) => {
      const t = r.querySelector(".time");
      if (t) t.textContent = clock(agentSeconds({ status: "running", startedAt: r.dataset.start }));
    });
  }

  // the phase rail: every phase of the run, sized by the agent time spent in it
  function phaseRail(wf) {
    const agents = (wf.run && wf.run.agents) || [];
    const names = (wf.phases || []).slice();
    agents.forEach((a) => { if (names.indexOf(a.phase) < 0) names.push(a.phase); });
    const secs = {};
    agents.forEach((a) => { secs[a.phase] = (secs[a.phase] || 0) + (agentSeconds(a) || 0); });
    const peak = Math.max(1, ...names.map((n) => secs[n] || 0));
    const rail = el("div", "rail");
    names.forEach((n) => {
      const list = agents.filter((a) => a.phase === n);
      const running = list.some((a) => a.status === "running");
      const bad = list.some((a) => a.status === "failed");
      const seg = el("div", "rail-seg " + (!list.length ? "idle" : running ? "run" : bad ? "bad" : "done"));
      const done = list.filter((a) => a.status !== "running").length;
      const bar = el("div", "bar");
      bar.style.width = (list.length ? Math.max(6, Math.round(100 * (secs[n] || 0) / peak)) : 100) + "%";
      seg.append(el("span", "ph", n), bar, el("span", "ct", list.length ? done + "/" + list.length : "not yet"));
      seg.title = list.length
        ? n + " · " + done + " of " + list.length + " agents done · " + clock(secs[n] || 0) + " of agent time"
        : n + " · not started in this run";
      rail.append(seg);
    });
    return rail;
  }

  function stat(n, total, label) {
    const w = el("div", "stat");
    const num = el("div", "n", String(n));
    num.append(el("small", "", " / " + total));
    w.append(num, el("div", "l", label));
    return w;
  }

  function statsRow(c, slices, req, ms) {
    const row = el("div", "stats");
    row.append(stat(c.done, slices.length, "slices done" + (c.parked ? ", " + c.parked + " parked" : "")));
    row.append(stat(req.done, req.total, "requirements · " + Math.round(100 * req.done / Math.max(1, req.total)) + "%"));
    const real = ms.filter((m) => !m.final && m.status !== null);
    if (real.length) row.append(stat(real.filter((m) => m.status === "verified").length, real.length, "milestones verified"));
    return row;
  }

  // slices finished over time, actual only: the pace at a glance, without the projection
  function spark(data) {
    const NS = "http://www.w3.org/2000/svg";
    const W = 260, H = 34;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("class", "spark");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("preserveAspectRatio", "none");
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Slices finished over time");
    const done = (data.slices || []).filter((s) => s.doneAt).map((s) => new Date(s.doneAt).getTime()).sort((a, b) => a - b);
    if (done.length < 2) return svg;
    const first = done[0], last = done[done.length - 1];
    const x = (t) => (t - first) / Math.max(1, last - first) * (W - 4) + 2;
    const y = (v) => H - 3 - (v / done.length) * (H - 6);
    let d = "M" + x(first).toFixed(1) + " " + y(0);
    done.forEach((t, i) => { d += " H" + x(t).toFixed(1) + " V" + y(i + 1).toFixed(1); });
    const mk = (t, a) => { const n = document.createElementNS(NS, t); for (const k in a) n.setAttribute(k, a[k]); return n; };
    svg.append(mk("path", { d: d, fill: "none", stroke: "currentColor", "stroke-width": 1.5, "vector-effect": "non-scaling-stroke" }));
    svg.style.color = getComputedStyle(document.documentElement).getPropertyValue("--held").trim();
    return svg;
  }

  // the hero: the run, if there is one. Otherwise the numbers.
  function runBand(data, c, slices, req, ms) {
    const band = el("section", "band");
    const wf = data.workflow;
    if (!(wf && wf.run)) {
      band.append(statsRow(c, slices, req, ms));
      return band;
    }
    const run = wf.run, agents = run.agents || [];
    const settled = agents.filter((a) => a.status !== "running").length;
    const failed = agents.filter((a) => a.status === "failed").length;
    const end = run.endedAt ? new Date(run.endedAt).getTime() : NOW();
    const top = el("div", "band-top");
    const left = el("div");
    const name = el("div", "run-name");
    name.append(el("span", "beacon" + (run.live ? " on" : " done")),
      document.createTextNode((data.run && data.run.label) || wf.name || "Run"));
    left.append(name);
    left.append(el("div", "run-line", [
      run.startedAt ? clock((end - new Date(run.startedAt).getTime()) / 1000) + " elapsed" : "",
      settled + " of " + agents.length + " agents done",
      failed ? failed + " failed" : "",
      run.live ? "" : "not running",
    ].filter(Boolean).join(" · ")));
    const busy = agents.filter((a) => a.status === "running");
    if (busy.length) left.append(el("div", "run-now", busy.map((a) => a.label).join(", ")));
    top.append(left, statsRow(c, slices, req, ms));
    band.append(top, phaseRail(wf));
    return band;
  }

  // a titled region; plain, not a <details>, because the page reloads every minute and would fold it shut
  function panel(title, hint, tag, cls) {
    const root = el(tag || "section", "panel" + (cls ? " " + cls : ""));
    const head = el("div", "panel-head");
    head.append(el("h2", "", title));
    if (hint) head.append(el("span", "hint", hint));
    const body = el("div", "panel-body");
    root.append(head, body);
    return { root, body };
  }

  function render(data) {
    const app = $("#app");
    app.replaceChildren();
    if (data.title) { $("#title").textContent = data.title; document.title = data.title + " · build tracker"; }
    const updated = new Date(data.updatedAt);
    const { slices, p, ms } = model(data);
    const c = { done: 0, parked: 0, in_progress: 0, todo: 0 };
    slices.forEach((s) => { c[s.status] = (c[s.status] || 0) + 1; });
    const open = slices.filter(isOpen).length;
    const req = data.requirements || { done: 0, total: 0, parked: 0 };

    if (data.example) app.append(el("div", "example", "Example tracker with made-up data. Your own is generated at .sdlc/tracker/index.html."));

    // freshness
    const fresh = $("#fresh");
    fresh.replaceChildren();
    const staleMin = (NOW() - updated.getTime()) / 60000;
    const finished = open === 0 && ms.every((m) => m.final || m.done);
    const pill = el("span", "pill " + (finished ? "ok" : staleMin > 45 ? "warn" : "live"));
    pill.append(el("span", "dot"), document.createTextNode(finished ? "Finished" : staleMin > 45 ? "Quiet" : "Running"));
    const updEl = el("span", staleMin > 45 ? "stale" : "", "Updated " + ago(updated) + " · " + fmtTime(updated));
    if (staleMin > 45) updEl.title = "No update for a while. While the loop runs, /sdlc regenerates this page every minute.";
    fresh.append(pill, updEl);

    app.append(runBand(data, c, slices, req, ms));

    const wfCol = panel("Agents in this run", "every agent the loop has spent on");
    wfScroll = el("div", "wf-scroll");
    // near the bottom of the box the tail is on; a scroll away from it pauses the tail
    wfScroll.addEventListener("scroll", () => {
      tailing = wfScroll.scrollTop >= wfScroll.scrollHeight - wfScroll.clientHeight - 24;
    });
    wfCol.body.append(wfScroll);
    wfSlot = wfCol.root;
    app.append(wfSlot);
    drawWorkflow(data.workflow, false);

    // three cards
    const g3 = el("section", "grid3");
    const now = el("div", "card");
    now.append(el("h2", "", "Working on now"));
    const act = data.activity || {};
    const role = (act.role || (data.current && data.current.phase) || "").replace(/-r\d+$/, "");
    const inCampaign = CAMPAIGN_STEPS.indexOf(role) >= 0;
    if (inCampaign) {
      now.append(el("div", "slice-id", act.target || "milestone"), el("div", "slice-title", "Behavior campaign on the running system"));
    } else if (data.current) {
      now.append(el("div", "slice-id", data.current.id), el("div", "slice-title", data.current.title));
    }
    if (inCampaign || data.current) {
      const steps = inCampaign ? CAMPAIGN_STEPS : SLICE_STEPS;
      const at = steps.indexOf(role);
      const bar = el("div", "steps");
      steps.forEach((_, i) => bar.append(el("i", i < at ? "past" : i === at ? "on" : "")));
      now.append(bar);
      const sl = el("div", "step-label");
      sl.append(el("b", "", NAMES[role] || role || "Working"), el("span", "", at >= 0 ? "step " + (at + 1) + " of " + steps.length : ""));
      now.append(sl);
    } else {
      now.append(el("p", "muted", finished ? "Everything is built." : "Between steps, picking what to do next."));
    }
    if (data.lastCommit && data.lastCommit.text) {
      const lc = el("div", "lastc", "Last commit " + ago(new Date(data.lastCommit.at)) + " · " + data.lastCommit.text);
      lc.title = data.lastCommit.text;
      now.append(lc);
    }
    g3.append(now);

    const pc = el("div", "card");
    pc.append(el("h2", "", "Pace & finish"));
    const all = ms[ms.length - 1];
    const dl = el("dl", "kv");
    const kv = (k, v, cls) => { dl.append(el("dt", "", k)); dl.append(el("dd", cls || "", v)); };
    kv("Time per slice", dur(p.mid));
    kv("Slices left", String(open));
    kv("Likely finish", all.eta.mid.toLocaleString(undefined, { weekday: "short", month: "short", day: "numeric" }));
    kv("Range", fmtShort(all.eta.low) + " \u2013 " + all.eta.high.toLocaleString(undefined, { weekday: "short", day: "numeric" }));
    const nextUi = ms.find((m) => m.ui && !m.done);
    if (nextUi) kv("Next to try", nextUi.name + " \u00b7 " + fmtDay(nextUi.eta.mid));
    const mach = data.machine || {};
    if (mach.load) kv("CPU load", mach.load.map((x) => Number(x).toFixed(1)).join(" \u00b7 "));
    if (mach.thermalSleepsToday != null) kv("Overheating", String(mach.thermalSleepsToday), mach.thermalSleepsToday > 0 ? "stale" : "");
    pc.append(dl);
    if (open > 1) {
      const sp = el("div");
      sp.style.marginTop = "12px";
      sp.append(spark(data));
      pc.append(sp);
    }
    g3.append(pc);

    // what only a person can unblock, kept above the fold
    const hc = el("div", "card");
    hc.append(el("h2", "", "Needs you"));
    const pl = el("div", "parked");
    slices.filter((s) => s.status === "parked").forEach((s) => { const r = el("div"); r.append(el("span", "mono", s.id), el("span", "", s.title)); pl.append(r); });
    (data.milestones || []).filter((m) => m.status === "exhausted").forEach((m) => { const r = el("div"); r.append(el("span", "mono", m.id), el("span", "", m.title + ": not verified after 3 campaigns")); pl.append(r); });
    if (!pl.children.length) pl.append(el("p", "note", "Nothing is waiting on you."));
    hc.append(pl);
    const rv = el("div", "review");
    const chip = (n, label) => { const s = el("span"); s.append(el("b", "", String(n)), document.createTextNode(" " + label)); return s; };
    if (data.decisions != null) rv.append(chip(data.decisions, "decisions in DECISIONS.md"));
    if (data.proposals != null) rv.append(chip(data.proposals, "proposals in SPEC-PROPOSALS.md"));
    if (rv.children.length) {
      hc.append(rv);
      hc.append(el("p", "note", "Parked slices ran out of escalation steps; they are retried at the end, or you can decide them by hand."));
    }
    g3.append(hc);

    // the full pace chart, with the projection, as a full-width row under the three cards
    const ch = panel("Slices finished over time", "solid is actual, dashed is projected", "div", "wide");
    const cw = el("div", "chart-wrap");
    cw.append(chart(data, p, open, slices.length - c.parked));
    ch.body.append(cw);
    g3.append(ch.root);
    app.append(g3);

    // milestones, one ruled row each
    const mil = panel("Milestones", ms.filter((m) => !m.final && !m.done).length + " still to build");
    ms.forEach((m) => {
      const row = el("div", "ms-row" + (m.done ? " done" : "") + (m.active ? " active" : ""));
      row.append(el("span", "dot"));
      const nm = el("div");
      const nameEl = el("div", "ms-name", m.name);
      if (m.ui) nameEl.append(el("span", "badge", "UI"));
      if (m.status) nameEl.append(el("span", "vbadge " + m.status, m.status === "pending" && m.built ? "to verify" : m.status));
      const what = el("div", "ms-what", m.what);
      what.title = m.what || "";
      nm.append(nameEl, what);
      row.append(nm);
      const prog = el("div", "ms-prog");
      const d = m.own.filter((s) => s.status === "done").length;
      const pkd = m.own.filter((s) => s.status === "parked").length;
      if (m.own.length) {
        const mini = el("div", "mini");
        m.own.forEach((s) => { const i = el("i", s.status); i.title = s.id + " \u00b7 " + s.title + " \u00b7 " + s.status.replace("_", " ") + (s.doneAt ? " \u00b7 " + fmtDay(new Date(s.doneAt)) : ""); mini.append(i); });
        prog.append(mini, el("div", "cnt", d + "/" + m.own.length + " done" + (pkd ? " \u00b7 " + pkd + " parked" : "")));
      } else {
        prog.append(el("div", "cnt", m.final ? "after all slices" : "no slices yet"));
      }
      row.append(prog);
      const eta = el("div", "ms-eta");
      if (m.done) eta.append(el("b", "", "Done"), el("span", "", m.doneAt ? fmtDay(new Date(m.doneAt)) : ""));
      else eta.append(el("b", "", fmtDay(m.eta.mid)), el("span", "", fmtShort(m.eta.low) + " \u2013 " + fmtShort(m.eta.high)));
      row.append(eta);
      mil.body.append(row);
    });
    app.append(mil.root);

    // events
    const ev = el("section", "card");
    const evh = el("div", "reports-head");
    evh.append(el("h2", "", "Recent events"));
    const evMore = el("button", "more", "Show all");
    evMore.type = "button";
    evh.append(evMore);
    ev.append(evh);
    const evs = el("div", "events");
    const evsAll = (data.recent || []).slice().reverse();
    const drawEvents = () => {
      evs.replaceChildren();
      evsAll.slice(0, evAllOn ? evsAll.length : 5).forEach((e) => {
        const r = el("div", "ev");
        const w = new Date(e.at);
        r.append(el("span", "when", isNaN(w) ? "" : w.toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" })));
        const body = el("div");
        const k = e.kind || "";
        body.append(el("div", "kind " + (k.includes("merged") ? "merged" : (k.includes("escalat") || k.includes("park")) ? "escalated" : ""), (k.replace("slice-", "").replace("-", " ") + (e.slice ? " " + e.slice : ""))));
        const t = el("div", "txt", e.text); t.title = e.text;
        body.append(t);
        r.append(body);
        evs.append(r);
      });
      if (!evsAll.length) evs.append(el("p", "note", "No events yet."));
      evMore.hidden = evsAll.length <= 5;
      evMore.textContent = evAllOn ? "Show fewer" : "Show all " + evsAll.length;
    };
    evMore.addEventListener("click", () => { evAllOn = !evAllOn; drawEvents(); });
    drawEvents();
    ev.append(evs);
    app.append(ev);

    if (data.reports) app.append(reportsCard(data.reports));
  }

  function chart(data, p, open, total) {
    const NS = "http://www.w3.org/2000/svg";
    const W = 1000, H = 190, L = 36, R = 14, T = 12, B = 26;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", "100%");
    svg.style.minWidth = "520px";
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Slices finished over time with projection");
    const mk = (tag, a) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); return n; };
    const css = getComputedStyle(document.documentElement);
    const col = (v) => css.getPropertyValue(v).trim();

    const start = new Date(data.startedAt).getTime();
    const upd = new Date(data.updatedAt).getTime();
    const times = data.slices.filter((s) => s.doneAt).map((s) => new Date(s.doneAt).getTime()).sort((a, b) => a - b);
    const end = upd + open * p.mid * 3600e3;
    const x = (t) => L + (t - start) / Math.max(1, end - start) * (W - L - R);
    const y = (v) => T + (1 - v / Math.max(1, total)) * (H - T - B);
    const txt = (a, s, fill) => { const t = mk("text", a); t.style.fill = fill || col("--faint"); t.textContent = s; return t; };

    [0, 0.5, 1].forEach((f) => {
      const v = Math.round(total * f);
      svg.append(mk("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: col("--line"), "stroke-width": 1 }));
      svg.append(txt({ x: L - 8, y: y(v) + 4, "text-anchor": "end" }, v));
    });
    const d0 = new Date(start); d0.setHours(24, 0, 0, 0);
    for (let t = d0.getTime(); t < end; t += 24 * 3600e3) {
      svg.append(mk("line", { x1: x(t), x2: x(t), y1: T, y2: H - B, stroke: col("--line"), "stroke-dasharray": "2 4" }));
      svg.append(txt({ x: x(t) + 4, y: H - 8 }, new Date(t).toLocaleDateString(undefined, { weekday: "short", day: "numeric" })));
    }
    let d = "M" + x(start) + " " + y(0), n = 0;
    times.forEach((t) => { d += " H" + x(t).toFixed(1) + " V" + y(++n).toFixed(1); });
    d += " H" + x(upd).toFixed(1);
    svg.append(mk("path", { d: d + " V" + y(0) + " Z", fill: col("--held"), opacity: 0.13 }));
    svg.append(mk("path", { d, fill: "none", stroke: col("--held"), "stroke-width": 2 }));
    svg.append(mk("line", { x1: x(upd), y1: y(n), x2: x(end), y2: y(total), stroke: col("--live"), "stroke-width": 2, "stroke-dasharray": "6 5" }));
    svg.append(mk("circle", { cx: x(upd), cy: y(n), r: 4.5, fill: col("--held") }));
    svg.append(mk("circle", { cx: x(end), cy: y(total), r: 4, fill: col("--surface"), stroke: col("--live"), "stroke-width": 2 }));
    svg.append(txt({ x: x(upd) + 9, y: y(n) + 4 }, n + " now", col("--ink")));
    svg.append(txt({ x: x(end) - 8, y: y(total) + 16, "text-anchor": "end" }, "all slices ~" + new Date(end).toLocaleString(undefined, { weekday: "short", hour: "2-digit" }), col("--live")));
    return svg;
  }

  // the watcher rewrites live.js within seconds of each agent event; a fresh <script> tag reads it,
  // which works from file:// where fetch does not
  function startLive() {
    const live = window.SDLC_createLive({ now: () => NOW(), redraw: drawWorkflow });
    window.SDLC_LIVE = (p) => { try { live.apply(p); } catch (err) { /* keep the last good card */ } };
    let probe = null;
    const poll = () => {
      try { live.tick(); } catch (err) { /* keep the last good card */ }
      try { tickClocks(); } catch (err) { /* the clocks just stop for a moment */ }
      if (probe) probe.remove();
      probe = document.createElement("script");
      probe.src = "live.js?t=" + Date.now();
      probe.onerror = () => {}; // no live.js: a one-off build, or a published copy
      document.body.append(probe);
    };
    poll();
    setInterval(poll, 2000);
  }
  // the page still reloads every minute for the other sections; come back to the same place
  function keepScroll() {
    try {
      const y = Number(sessionStorage.getItem("sdlc-scroll"));
      if (y) window.scrollTo(0, y);
    } catch (err) { /* no sessionStorage */ }
    window.addEventListener("pagehide", () => {
      try { sessionStorage.setItem("sdlc-scroll", String(window.scrollY)); } catch (err) { /* no sessionStorage */ }
    });
  }

  const data = window.SDLC_STATUS;
  if (!data) return;
  // an example page is frozen at its own timestamp so it never looks stale
  if (data.example) NOW = () => new Date(data.updatedAt).getTime();
  try { render(data); } catch (err) { $("#app").replaceChildren(el("div", "card empty", "Couldn't draw the status: " + err.message)); }
  if (!data.example) { keepScroll(); startLive(); }
})();
</script>
