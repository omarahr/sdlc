name: test

on:
  push:
    branches: [main]
  pull_request:

# a newer push to the same branch makes the old run irrelevant
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # the plugin drives git, python and local builds, so the suite runs against both platforms it supports
    runs-on: ${{ matrix.os }}
    # a wedged run must fail fast and free the runner: the suite takes about a minute, and the default
    # 6 h timeout let one hang squat the account's macOS slots for hours (2026-10-06)
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 24] # 20 is the floor in package.json; drop it there if that floor is raised
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # next-action.py, state-write.py, suite-receipt.py and the tracker collector are python. Without this
      # the python tests skip themselves and the run goes green having checked almost nothing.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # no dependencies and no lockfile, so there is nothing to install
      - name: Test
        run: npm test
      # debug: if the plain run hangs, this variant names whether tests finished (force-exit) or a test never settles
      - name: Test with force-exit
        if: always()
        run: node --test --test-force-exit skills/sdlc/test/*.test.mjs
        timeout-minutes: 6