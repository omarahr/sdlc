<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="refresh" content="60">
<title>SDLC Build Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --ground: #eef0f3;
  --surface: #ffffff;
  --sunk: #f6f7f9;
  --ink: #131720;
  --muted: #586173;
  --faint: #8b93a2;
  --line: #e1e4ea;
  --accent: #2f4fd8;
  --accent-soft: #e7ebfd;
  --done: #1b8353;
  --done-soft: #ddf1e6;
  --parked: #b26a0e;
  --parked-soft: #fbecd6;
  --todo: #d7dbe2;
  --warn: #c2410c;
  --shadow: 0 1px 2px rgba(19, 23, 32, .05), 0 6px 20px rgba(19, 23, 32, .04);
  --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground: #0c0f14;
    --surface: #151920;
    --sunk: #1a1f27;
    --ink: #e9ecf2;
    --muted: #a3abba;
    --faint: #6e7787;
    --line: #252b35;
    --accent: #93a4ff;
    --accent-soft: #1d2442;
    --done: #4dc48b;
    --done-soft: #13281f;
    --parked: #e8a640;
    --parked-soft: #2d2213;
    --todo: #2f3642;
    --warn: #fb923c;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --ground: #0c0f14;
  --surface: #151920;
  --sunk: #1a1f27;
  --ink: #e9ecf2;
  --muted: #a3abba;
  --faint: #6e7787;
  --line: #252b35;
  --accent: #93a4ff;
  --accent-soft: #1d2442;
  --done: #4dc48b;
  --done-soft: #13281f;
  --parked: #e8a640;
  --parked-soft: #2d2213;
  --todo: #2f3642;
  --warn: #fb923c;
  --shadow: none;
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.45; }
.wrap { max-width: 1120px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 56px; display: grid; gap: 22px; }
#app { display: grid; gap: 20px; min-width: 0; }
@media (max-width: 560px) { .wrap { gap: 16px; padding-block: 20px 40px; } #app { gap: 14px; } }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 11.5px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--faint); }
p { margin: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; }
.top .sub { color: var(--muted); font-size: 13px; }
.fresh { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.pill.ok { background: var(--done-soft); color: var(--done); }
.pill.warn { background: var(--parked-soft); color: var(--parked); }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.live .dot { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
@media (prefers-reduced-motion: reduce) { .pill.live .dot { animation: none; } }
.stale { color: var(--warn); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 18px 20px; min-width: 0; }

/* hero */
.hero { display: grid; gap: 20px; padding: 22px 24px; }
.hero-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px 32px; }
.headline { display: flex; align-items: baseline; gap: 22px; flex-wrap: wrap; }
.big { font-family: var(--mono); font-size: 34px; font-weight: 500; letter-spacing: -.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.big small { font-size: 16px; color: var(--faint); letter-spacing: 0; }
.big-label { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.next { text-align: right; }
.next .lbl { font-size: 12px; color: var(--muted); }
.next .what { font-size: 17px; font-weight: 600; }
.next .when { font-family: var(--mono); font-size: 13px; color: var(--accent); margin-top: 2px; }
@media (max-width: 640px) { .next { text-align: left; } }

.track { display: flex; gap: 3px; height: 14px; }
.seg { position: relative; height: 100%; border-radius: 3px; background: var(--todo); overflow: hidden; min-width: 10px; display: flex; }
.seg i { display: block; height: 100%; }
.seg .d { background: var(--done); }
.seg .p { background: var(--parked); }
.seg.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.seg.ui::after { content: ""; position: absolute; right: 2px; top: 2px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.track-labels { display: flex; gap: 3px; margin-top: 6px; }
.track-labels span { font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 10px; }
.track-labels span.cur { color: var(--accent); font-weight: 600; }
@media (max-width: 720px) { .track-labels { display: none; } }

/* three cards */
.grid3 { display: grid; grid-template-columns: 1.35fr 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 > :first-child { grid-column: 1 / -1; } }
@media (max-width: 560px) { .grid3 { grid-template-columns: 1fr; } }
.card h2 { margin-bottom: 12px; }
.slice-id { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.slice-title { font-size: 16px; font-weight: 600; line-height: 1.3; margin-top: 2px; }
.steps { display: flex; gap: 3px; margin-top: 12px; }
.steps i { flex: 1; height: 5px; border-radius: 3px; background: var(--todo); }
.steps i.past { background: var(--done); }
.steps i.on { background: var(--accent); }
.step-label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 6px; gap: 8px; }
.step-label b { color: var(--accent); font-weight: 600; }
.lastc { font-size: 12px; color: var(--faint); margin-top: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; margin: 0; font-size: 13px; align-items: baseline; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.meter { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--todo); overflow: hidden; margin-top: -3px; }
.meter i { display: block; height: 100%; background: var(--accent); }

/* milestones table */
.ms-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.ms-note { font-size: 12px; color: var(--faint); }
.ms-table { width: 100%; border-collapse: collapse; }
.ms-table td { padding: 12px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
.ms-table tr:first-child td { border-top: 0; }
.ms-table td:first-child { padding-left: 0; width: 22px; }
.ms-table td:last-child { padding-right: 0; text-align: right; white-space: nowrap; }
.dot { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--todo); display: block; }
tr.done .dot { background: var(--done); border-color: var(--done); }
tr.active .dot { border-color: var(--accent); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); }
tr.active { background: linear-gradient(90deg, var(--accent-soft), transparent 60%); }
.ms-name { font-weight: 600; font-size: 14px; }
.ms-what { font-size: 12.5px; color: var(--muted); }
tr.done .ms-name, tr.done .ms-what { color: var(--muted); }
tr.done .ms-name { font-weight: 500; }
.badge { font-size: 9.5px; font-weight: 700; letter-spacing: .07em; padding: 2px 5px; border-radius: 4px; background: var(--accent); color: var(--surface); margin-left: 7px; vertical-align: 2px; }
.prog { width: 160px; }
.prog .mini { display: flex; gap: 2px; height: 8px; }
.prog .mini i { flex: 1; border-radius: 2px; background: var(--todo); }
.prog .mini i.done { background: var(--done); }
.prog .mini i.parked { background: var(--parked); }
.prog .mini i.in_progress { background: var(--accent); }
.prog .cnt { font-family: var(--mono); font-size: 11.5px; color: var(--faint); margin-top: 4px; }
.eta b { font-family: var(--mono); font-weight: 500; font-size: 13px; display: block; }
.eta span { font-family: var(--mono); font-size: 11.5px; color: var(--faint); }
tr.done .eta b { color: var(--done); }
@media (max-width: 680px) {
  .prog { display: none; }
  .ms-what { display: none; }
}

/* chart */
.chart-wrap { overflow-x: auto; margin-top: 4px; }
svg text { font-family: var(--mono); font-size: 11px; }

/* bottom */
.grid2 { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
@media (max-width: 820px) { .grid2 { grid-template-columns: 1fr; } }
.events { display: grid; gap: 10px; }
.ev { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 0 12px; font-size: 13px; }
.ev .when { font-family: var(--mono); font-size: 11.5px; color: var(--faint); padding-top: 1px; }
.ev .kind { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.ev .kind.merged { color: var(--done); }
.ev .kind.escalated { color: var(--parked); }
.ev .txt { color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.parked { display: grid; gap: 8px; font-size: 13px; }
.parked div { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; }
.parked .mono { color: var(--parked); font-size: 12px; }
.note { font-size: 12px; color: var(--faint); }
.review { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
.review span { font-size: 12px; background: var(--sunk); border: 1px solid var(--line); padding: 4px 9px; border-radius: 6px; color: var(--muted); }
.review b { font-family: var(--mono); color: var(--ink); font-weight: 500; }
.empty { padding: 48px 0; text-align: center; color: var(--muted); }

.vbadge { font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 4px; margin-left: 7px; vertical-align: 2px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); }
.vbadge.verified { background: var(--done-soft); color: var(--done); border-color: transparent; }
.vbadge.fixing, .vbadge.exhausted { background: var(--parked-soft); color: var(--parked); border-color: transparent; }
.example { font-size: 12px; background: var(--accent-soft); color: var(--accent); padding: 8px 12px; border-radius: 8px; }
.reports-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.reports-head input { font: inherit; font-size: 13px; padding: 5px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--sunk); color: var(--ink); min-width: 0; width: 220px; max-width: 100%; }
.rep-list { display: grid; gap: 0; }
.rep { display: grid; grid-template-columns: 70px minmax(0, 1fr) auto; gap: 4px 12px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 13px; }
.rep:first-child { border-top: 0; }
.rep a.id { font-family: var(--mono); font-size: 12px; color: var(--accent); text-decoration: none; }
.rep a.id:hover { text-decoration: underline; }
.rep .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.rep .n { font-family: var(--mono); font-size: 11.5px; color: var(--faint); white-space: nowrap; }
.rep .n.has { color: var(--done); }
.rep .lenses { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
.lens { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--sunk); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.lens.held { background: var(--done-soft); color: var(--done); border-color: transparent; }
.lens.refuted { background: var(--parked-soft); color: var(--parked); border-color: transparent; }
.rep-more { margin-top: 10px; font: inherit; font-size: 12.5px; background: none; border: 1px solid var(--line); color: var(--accent); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.wf { font-family: var(--mono); font-size: 12.5px; }
.wf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 16px; flex-wrap: wrap; margin-bottom: 12px; }
.wf-head .name { color: var(--accent); font-weight: 500; font-size: 14px; }
.wf-head .desc { color: var(--muted); flex: 1 1 320px; min-width: 0; }
.wf-head .tot { color: var(--muted); white-space: nowrap; }
.wf-head .paused { color: var(--warn); white-space: nowrap; }
.wf-slot { display: contents; }
.wf-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.wf-phases { border-right: 1px solid var(--line); padding: 8px 0; background: var(--sunk); }
.wf-phase { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 6px; align-items: baseline; width: 100%; padding: 4px 12px; border: 0; background: none; font: inherit; color: var(--ink); text-align: left; cursor: pointer; }
.wf-phase:hover { background: var(--accent-soft); }
.wf-phase.sel { background: var(--accent-soft); color: var(--accent); }
.wf-phase.idle { color: var(--faint); cursor: default; }
.wf-phase.idle:hover { background: none; }
.wf-phase .mk { text-align: right; color: var(--faint); }
.wf-phase .cnt { color: var(--faint); }
.wf-phase.sel .cnt { color: var(--accent); }
.wf .ok { color: var(--done); }
.wf .bad { color: var(--warn); }
.wf .run { color: var(--accent); animation: pulse 2s ease-in-out infinite; }
.wf-agents { padding: 8px 14px 12px; min-width: 0; }
.wf-agents h3 { font: inherit; font-weight: 500; color: var(--ink); margin: 2px 0 8px; }
.wf-agents h3 span { color: var(--faint); font-weight: 400; }
.wf-agent { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto auto; gap: 10px; align-items: baseline; padding: 3px 0; }
.wf-agent .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.wf-agent .meta, .wf-agent .time { color: var(--faint); white-space: nowrap; }
.wf-agent.failed .lbl, .wf-agent.stopped .lbl { color: var(--muted); }
.wf-foot { display: flex; gap: 6px 16px; flex-wrap: wrap; margin-top: 10px; color: var(--faint); font-size: 12px; }
.wf-foot button { font: inherit; background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; }
.wf-earlier { margin-top: 10px; font-size: 12px; color: var(--muted); }
.wf-earlier summary { cursor: pointer; color: var(--accent); }
.wf-earlier div { padding: 3px 0; }
@media (max-width: 720px) {
  .wf-body { grid-template-columns: 1fr; }
  .wf-phases { border-right: 0; border-bottom: 1px solid var(--line); }
  .wf-agent { grid-template-columns: 18px minmax(0, 1fr) auto; }
  .wf-agent .meta { display: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">SDLC Build Tracker</h1>
      <p class="sub">Autonomous build of the spec with /sdlc, one slice at a time.</p>
    </div>
    <div class="fresh" id="fresh"></div>
  </header>
  <div id="app"><div class="card empty">No status yet. Run the tracker collector.</div></div>
</div>
<script>
window.SDLC_STATUS = /*__SDLC_STATUS__*/null;
</script>
<script>
/* live:begin */
(function (root) {
  "use strict";
  // a live run whose live.js has not moved for this long has lost its watcher
  const PAUSED_MS = 30 * 1000;
  // decides when the workflow card is redrawn from a live.js payload; the page wires it to the DOM
  root.SDLC_createLive = function (opts) {
    let builtAt = "", wf = null, paused = false;
    const isPaused = () => !!wf.run.live && opts.now() - Date.parse(builtAt) > PAUSED_MS;
    return {
      apply(p) {
        if (!p || typeof p.builtAt !== "string" || isNaN(Date.parse(p.builtAt)) || p.builtAt <= builtAt) return false;
        // a payload without a run (the journal was unreadable for a moment) keeps the last good card
        if (!p.workflow || !p.workflow.run) return false;
        builtAt = p.builtAt;
        wf = p.workflow;
        paused = isPaused();
        opts.redraw(wf, paused);
        return true;
      },
      // runs on every poll: a dead watcher sends nothing, so the paused note has to come from the clock
      tick() {
        if (!wf || isPaused() === paused) return false;
        paused = !paused;
        opts.redraw(wf, paused);
        return true;
      },
    };
  };
})(typeof window !== "undefined" ? window : globalThis);
/* live:end */
</script>
<script>
(function () {
  "use strict";

  // Hours added after the last slice (final audit + bar raiser) and per unverified milestone campaign.
  const FINAL_SLICES = 3;
  const CAMPAIGN_HOURS = { low: 1, mid: 2, high: 4 };
  const SLICE_STEPS = ["planner", "plan-critic", "test-writer", "implementer", "verifier", "reviewer", "integrator"];
  const CAMPAIGN_STEPS = ["scenario-planner", "coverage-critic", "e2e-harness", "scenario-runner", "behavior-judge", "milestone-writer"];
  const NAMES = {
    "planner": "Planning", "plan-critic": "Plan review", "test-writer": "Writing tests", "implementer": "Implementing",
    "verifier": "Verifying", "reviewer": "Code review", "integrator": "Merging", "escalator": "Escalating",
    "decision-judge": "Deciding", "decision-proposer": "Deciding", "state-writer": "Saving state", "state-reader": "Choosing next step",
    "scenario-planner": "Planning scenarios", "coverage-critic": "Reviewing coverage", "e2e-harness": "Booting the stack",
    "scenario-runner": "Running scenarios", "behavior-judge": "Judging failures", "milestone-writer": "Writing the report",
    "milestone-planner": "Planning milestones"
  };

  const $ = (s) => document.querySelector(s);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
  const fmtDay = (d) => d.toLocaleString(undefined, { weekday: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  const fmtShort = (d) => d.toLocaleString(undefined, { weekday: "short", hour: "2-digit" });
  const fmtTime = (d) => d.toLocaleString(undefined, { hour: "2-digit", minute: "2-digit" });
  let NOW = () => Date.now();
  function ago(d) {
    const m = Math.round((NOW() - d.getTime()) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + " min ago";
    return Math.floor(m / 60) + " h " + (m % 60) + " min ago";
  }
  function inHours(h) {
    if (h < 1) return "in " + Math.max(1, Math.round(h * 60)) + " min";
    if (h < 48) return "in ~" + Math.round(h) + " h";
    return "in ~" + (h / 24).toFixed(1) + " days";
  }
  function dur(h) { return h < 1 ? Math.round(h * 60) + " min" : h.toFixed(1) + " h"; }
  const isOpen = (s) => s.status === "todo" || s.status === "in_progress" || s.status === "awaiting-merge";

  function pace(data) {
    const now = new Date(data.updatedAt).getTime();
    const times = data.slices.filter((s) => s.doneAt).map((s) => new Date(s.doneAt).getTime()).sort((a, b) => a - b);
    const recent = times.filter((t) => t > now - 24 * 3600e3).length;
    let mid = 2;
    if (recent >= 3) mid = 24 / recent;
    else if (times.length >= 2) mid = (now - times[0]) / 3600e3 / times.length;
    return { low: mid * 0.6, mid, high: mid * 1.6, recent };
  }

  // Milestones come from .sdlc/milestones.json. Members: listed ids, their split children, and fix slices.
  function groups(data) {
    const slices = data.slices || [];
    const list = (data.milestones || []).filter((m) => m && m.id);
    const taken = new Set();
    const out = list.map((m) => {
      const ids = (m.slices || []).concat(m.fixSlices || []);
      const own = slices.filter((s) => !taken.has(s.id) && ids.some((id) => s.id === id || (s.id.startsWith(id) && /^[a-z]$/.test(s.id.slice(id.length)))));
      own.forEach((s) => taken.add(s.id));
      return { id: m.id, name: m.title || m.id, what: m.demo || "", ui: !!m.ui, status: m.status || null, own };
    });
    const rest = slices.filter((s) => !taken.has(s.id));
    if (rest.length) out.push({ id: "rest", name: list.length ? "Not yet in a milestone" : "All slices", what: "", ui: false, status: null, own: rest });
    out.push({ id: "END", name: "Final audit & polish", what: "Spec audit, then bar-raiser rounds if enabled", final: true, own: [] });
    return out;
  }

  function model(data) {
    const slices = data.slices || [];
    const p = pace(data);
    const upd = new Date(data.updatedAt).getTime();
    let openSoFar = 0, campaignsSoFar = { low: 0, mid: 0, high: 0 };
    let activeFound = false;
    const ms = groups(data).map((m) => {
      openSoFar += m.own.filter(isOpen).length;
      const needsCampaign = !m.final && m.status !== null && m.status !== "verified" && m.status !== "exhausted";
      if (needsCampaign) Object.keys(campaignsSoFar).forEach((k) => { campaignsSoFar[k] += CAMPAIGN_HOURS[k]; });
      const built = m.own.length > 0 && m.own.every((s) => !isOpen(s));
      const done = !m.final && built && !needsCampaign;
      const extra = (k) => campaignsSoFar[k] + (m.final ? FINAL_SLICES * p[k] : 0);
      const at = (k) => new Date(upd + (openSoFar * p[k] + extra(k)) * 3600e3);
      const out = Object.assign({}, m, {
        done, built,
        eta: { low: at("low"), mid: at("mid"), high: at("high") },
        hours: openSoFar * p.mid + extra("mid"),
        doneAt: done ? m.own.filter((s) => s.doneAt).map((s) => new Date(s.doneAt)).sort((a, b) => b - a)[0] : null,
        active: false
      });
      if (!done && !activeFound) { out.active = true; activeFound = true; }
      return out;
    });
    return { slices, p, ms };
  }

      box.replaceChildren();

      const hits = list.slice().reverse().filter((r) => !q || (r.id + " " + r.title).toLowerCase().includes(q));

        });

        box.append(row);
      });
      if (!shown.length) box.append(el("p", "note", list.length ? "No slice matches." : "No verifier reports yet."));
      more.hidden = !!q || hits.length <= 8;

    };
    input.addEventListener("input", () => { repFilter = input.value; draw(); });
    more.addEventListener("click", () => { repAll = !repAll; draw(); });
    draw();
    card.append(box, more);
    return card;
  }

  // the live workflow view: the same phases and agents as Claude Code's /workflows screen
  function clock(sec) {
    if (sec == null || isNaN(sec)) return "";
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const two = (n) => String(n).padStart(2, "0");
    return h ? h + "h" + two(m) + "m" : m ? m + "m" + two(s) + "s" : s + "s";
  }
  function tokens(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "k tok" : (n || 0) + " tok"; }
  function agentSeconds(a) {
    if (a.status === "running" && a.startedAt) return (NOW() - new Date(a.startedAt).getTime()) / 1000;
    return a.seconds;
  }
  function pinned(runId, set) {
    try {
      if (set !== undefined) { if (set) sessionStorage.setItem("sdlc-wf", runId + "|" + set); else sessionStorage.removeItem("sdlc-wf"); return set; }
      const v = (sessionStorage.getItem("sdlc-wf") || "").split("|");
      return v[0] === runId ? v[1] : null;
    } catch (e) { return set || null; }
  }
  function workflowCard(wf, paused) {
    const run = wf.run, agents = run.agents || [];
    const card = el("section", "card wf");
    const names = (wf.phases || []).slice();
    agents.forEach((a) => { if (names.indexOf(a.phase) < 0) names.push(a.phase); });
    const by = {};
    names.forEach((n) => { by[n] = []; });
    agents.forEach((a) => by[a.phase].push(a));
    const settled = agents.filter((a) => a.status !== "running").length;
    const failed = agents.filter((a) => a.status === "failed").length;
    const end = run.endedAt ? new Date(run.endedAt).getTime() : NOW();
    const head = el("div", "wf-head");
    head.append(el("span", "name", wf.name || "workflow"), el("span", "desc", wf.description || ""),
      el("span", "tot", settled + "/" + agents.length + " agents" + (run.startedAt ? " · " + clock((end - new Date(run.startedAt).getTime()) / 1000) : "") + (run.live ? "" : " · not running")));
    if (paused) head.append(el("span", "paused", "live updates paused"));
    card.append(head);

    // follow the agent that started last among the running ones, or the last agent of a finished run
    const busy = agents.filter((a) => a.status === "running");
    const auto = busy.length ? busy[busy.length - 1].phase : agents.length ? agents[agents.length - 1].phase : names[0];
    let sel = pinned(run.id);
    if (!sel || !by[sel] || !by[sel].length) sel = auto;

    const body = el("div", "wf-body");
    const left = el("div", "wf-phases");
    const right = el("div", "wf-agents");
    const foot = el("div", "wf-foot");
    const draw = () => {
      left.replaceChildren();
      names.forEach((n, i) => {
        const list = by[n];
        const done = list.filter((a) => a.status !== "running").length;
        const b = el("button", "wf-phase" + (n === sel ? " sel" : "") + (list.length ? "" : " idle"));
        b.type = "button";
        const running = list.some((a) => a.status === "running");
        const bad = list.some((a) => a.status === "failed");
        const mk = !list.length ? el("span", "mk", String(i + 1)) : running ? el("span", "mk run", "●") : el("span", "mk " + (bad ? "bad" : "ok"), bad ? "!" : "✔");
        b.append(mk, el("span", "", n), el("span", "cnt", list.length ? done + "/" + list.length : ""));
        b.title = !list.length ? "Not started in this run" : running ? "Running" : bad ? "Finished; some agents failed and were retried" : "Finished";
        if (list.length) b.addEventListener("click", () => { sel = n; pinned(run.id, n === auto ? "" : n); draw(); });
        left.append(b);
      });
      right.replaceChildren();
      const list = by[sel] || [];
      const total = list.reduce((t, a) => t + (agentSeconds(a) || 0), 0);
      const h = el("h3", "", sel + " ");
      h.append(el("span", "", "· " + list.length + (list.length === 1 ? " agent" : " agents") + (total ? " · " + clock(total) + " of agent time" : "")));
      right.append(h);
      list.forEach((a) => {
        const r = el("div", "wf-agent " + a.status);
        const icon = a.status === "done" ? el("span", "ok", "✔") : a.status === "failed" ? el("span", "bad", "✘") : a.status === "running" ? el("span", "run", "●") : el("span", "", "○");
        icon.title = a.status === "stopped" ? "The run ended before this agent finished" : a.status;
        const lbl = el("span", "lbl", a.label); lbl.title = a.label;
        r.append(icon, lbl, el("span", "meta", (a.model ? a.model + " · " : "") + tokens(a.tokens)), el("span", "time", clock(agentSeconds(a))));
        right.append(r);
      });
      if (!list.length) right.append(el("p", "note", "No agent has run in this phase yet."));
      foot.replaceChildren();
      if (failed) foot.append(el("span", "bad", failed + (failed === 1 ? " agent failed" : " agents failed") + " in this run"));
      if (sel !== auto) {
        const f = el("button", "", "Follow the live phase");
        f.type = "button";
        f.addEventListener("click", () => { sel = auto; pinned(run.id, ""); draw(); });
        foot.append(f);
      }
    };
    draw();
    body.append(left, right);
    card.append(body, foot);
    if ((wf.earlier || []).length) {
      const d = el("details", "wf-earlier");
      d.append(el("summary", "", wf.earlier.length + (wf.earlier.length === 1 ? " earlier run" : " earlier runs") + " of this loop"));
      wf.earlier.forEach((r) => {
        const span = r.startedAt && r.endedAt ? clock((new Date(r.endedAt) - new Date(r.startedAt)) / 1000) : "";
        d.append(el("div", "", (r.startedAt ? fmtDay(new Date(r.startedAt)) + " · " : "") + r.done + "/" + r.agents + " agents done" + (r.failed ? " · " + r.failed + " failed" : "") + (r.stopped ? " · " + r.stopped + " cut off" : "") + (span ? " · " + span : "")));
      });
      card.append(d);
    }
    return card;
  }

  function chart(data, p, open, total) {
    const NS = "http://www.w3.org/2000/svg";
    const W = 1000, H = 190, L = 36, R = 14, T = 12, B = 26;
    const svg = document.createElementNS(NS, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", "100%");
    svg.style.minWidth = "520px";
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Slices finished over time with projection");
    const mk = (tag, a) => { const n = document.createElementNS(NS, tag); for (const k in a) n.setAttribute(k, a[k]); return n; };
    const css = getComputedStyle(document.documentElement);
    const col = (v) => css.getPropertyValue(v).trim();

    const start = new Date(data.startedAt).getTime();
    const upd = new Date(data.updatedAt).getTime();
    const times = data.slices.filter((s) => s.doneAt).map((s) => new Date(s.doneAt).getTime()).sort((a, b) => a - b);
    const end = upd + open * p.mid * 3600e3;
    const x = (t) => L + (t - start) / Math.max(1, end - start) * (W - L - R);
    const y = (v) => T + (1 - v / Math.max(1, total)) * (H - T - B);
    const txt = (a, s, fill) => { const t = mk("text", a); t.style.fill = fill || col("--faint"); t.textContent = s; return t; };

    [0, 0.5, 1].forEach((f) => {
      const v = Math.round(total * f);
      svg.append(mk("line", { x1: L, x2: W - R, y1: y(v), y2: y(v), stroke: col("--line"), "stroke-width": 1 }));
      svg.append(txt({ x: L - 8, y: y(v) + 4, "text-anchor": "end" }, v));
    });
    const d0 = new Date(start); d0.setHours(24, 0, 0, 0);
    for (let t = d0.getTime(); t < end; t += 24 * 3600e3) {
      svg.append(mk("line", { x1: x(t), x2: x(t), y1: T, y2: H - B, stroke: col("--line"), "stroke-dasharray": "2 4" }));
      svg.append(txt({ x: x(t) + 4, y: H - 8 }, new Date(t).toLocaleDateString(undefined, { weekday: "short", day: "numeric" })));
    }
    let d = "M" + x(start) + " " + y(0), n = 0;
    times.forEach((t) => { d += " H" + x(t).toFixed(1) + " V" + y(++n).toFixed(1); });
    d += " H" + x(upd).toFixed(1);
    svg.append(mk("path", { d: d + " V" + y(0) + " Z", fill: col("--done"), opacity: 0.13 }));
    svg.append(mk("path", { d, fill: "none", stroke: col("--done"), "stroke-width": 2 }));
    svg.append(mk("line", { x1: x(upd), y1: y(n), x2: x(end), y2: y(total), stroke: col("--accent"), "stroke-width": 2, "stroke-dasharray": "6 5" }));
    svg.append(mk("circle", { cx: x(upd), cy: y(n), r: 4.5, fill: col("--done") }));
    svg.append(mk("circle", { cx: x(end), cy: y(total), r: 4, fill: col("--surface"), stroke: col("--accent"), "stroke-width": 2 }));
    svg.append(txt({ x: x(upd) + 9, y: y(n) + 4 }, n + " now", col("--ink")));
    svg.append(txt({ x: x(end) - 8, y: y(total) + 16, "text-anchor": "end" }, "all slices ~" + new Date(end).toLocaleString(undefined, { weekday: "short", hour: "2-digit" }), col("--accent")));
    return svg;
  }

  // the watcher rewrites live.js within seconds of each agent event; a fresh <script> tag reads it,
  // which works from file:// where fetch does not
  function startLive() {
    const live = window.SDLC_createLive({ now: () => NOW(), redraw: drawWorkflow });
    window.SDLC_LIVE = (p) => { try { live.apply(p); } catch (err) { /* keep the last good card */ } };
    let probe = null;
    const poll = () => {
      try { live.tick(); } catch (err) { /* keep the last good card */ }
      if (probe) probe.remove();
      probe = document.createElement("script");
      probe.src = "live.js?t=" + Date.now();
      probe.onerror = () => {}; // no live.js: a one-off build, or a published copy
      document.body.append(probe);
    };
    poll();
    setInterval(poll, 2000);
  }
  // the page still reloads every minute for the other sections; come back to the same place
  function keepScroll() {
    try {
      const y = Number(sessionStorage.getItem("sdlc-scroll"));
      if (y) window.scrollTo(0, y);
    } catch (err) { /* no sessionStorage */ }
    window.addEventListener("pagehide", () => {
      try { sessionStorage.setItem("sdlc-scroll", String(window.scrollY)); } catch (err) { /* no sessionStorage */ }
    });
  }

  const data = window.SDLC_STATUS;
  if (!data) return;
  // an example page is frozen at its own timestamp so it never looks stale
  if (data.example) NOW = () => new Date(data.updatedAt).getTime();
  try { render(data); } catch (err) { $("#app").replaceChildren(el("div", "card empty", "Couldn't draw the status: " + err.message)); }
  if (!data.example) { keepScroll(); startLive(); }
})();
</script>
</body>
</html>
